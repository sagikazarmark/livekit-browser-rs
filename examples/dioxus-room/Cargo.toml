[package]
name = "livekit-dioxus-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["web"]
raw-js-contract = ["livekit-browser?/raw-js"]
server = ["dioxus/fullstack", "dioxus/server", "dep:livekit-api"]
web = [
    "dioxus/web",
    "dep:dioxus",
    "dep:futures-util",
    "dep:gloo-timers",
    "dep:js-sys",
    "dep:livekit-browser",
    "dep:livekit-browser-dioxus",
    "dep:livekit-browser-recording",
    "dep:serde_json",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
dioxus = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
livekit-browser = { path = "../../crates/livekit-browser", optional = true }
livekit-browser-dioxus = { path = "../../crates/livekit-browser-dioxus", optional = true }
livekit-browser-recording = { path = "../../crates/livekit-browser-recording", optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Document",
    "Element",
    "Headers",
    "HtmlAudioElement",
    "HtmlVideoElement",
    "Location",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "UrlSearchParams",
    "Window",
] }

livekit-api = { version = "=0.5.6", default-features = false, features = ["access-token"], optional = true }

[[bin]]
name = "livekit-dioxus-prototype"
path = "src/main.rs"
