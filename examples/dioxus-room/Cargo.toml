[package]
name = "livekit-dioxus-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[features]
raw-js-contract = ["livekit-browser/raw-js"]

[dependencies]
dioxus = { workspace = true }
futures-util = { workspace = true }
gloo-timers = { workspace = true }
js-sys = { workspace = true }
livekit-browser = { path = "../../crates/livekit-browser" }
livekit-browser-dioxus = { path = "../../crates/livekit-browser-dioxus" }
livekit-browser-recording = { path = "../../crates/livekit-browser-recording" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "Headers",
    "HtmlAudioElement",
    "HtmlVideoElement",
    "Location",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "UrlSearchParams",
    "Window",
] }
