[package]
name = "demo"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["web"]
raw-js-contract = ["livekit-browser?/raw-js"]
# Access-token minting, shared by the native server and the Cloudflare Worker.
# Testable on its own with `cargo test --no-default-features --features token`.
token = ["dep:base64", "dep:hmac", "dep:serde_json", "dep:sha2", "dep:web-time"]
server = ["token", "dioxus/fullstack", "dioxus/server"]
worker = ["token", "dep:worker"]
web = [
    "dioxus/web",
    "dep:dioxus",
    "dep:futures-util",
    "dep:gloo-timers",
    "dep:js-sys",
    "dep:livekit-browser",
    "dep:livekit-browser-dioxus",
    "dep:livekit-browser-recording",
    "dep:serde_json",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
livekit-browser = { path = "../crates/livekit-browser", optional = true }
livekit-browser-dioxus = { path = "../crates/livekit-browser-dioxus", optional = true }
livekit-browser-recording = { path = "../crates/livekit-browser-recording", optional = true }

dioxus = { version = "0.7", optional = true }
futures-util = { version = "0.3", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Document",
    "Element",
    "Headers",
    "HtmlAudioElement",
    "HtmlVideoElement",
    "Location",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "UrlSearchParams",
    "Window",
] }

base64 = { version = "0.22", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
# `std::time::SystemTime::now()` panics on wasm32-unknown-unknown; this maps it
# to `Date.now()` there and to `std::time` on the native server.
web-time = { version = "1.1", optional = true }
worker = { version = "0.8", optional = true }

# Only the reference implementation the token tests are pinned against; the
# Worker build cannot use it (see `src/token.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
livekit-api = { version = "=0.5.6", default-features = false, features = ["access-token"] }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "demo"
path = "src/main.rs"

[workspace]

[profile.wasm-dev]
inherits = "dev"
debug = false

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
# wasm-bindgen needs the target_features section when generating Worker catch wrappers.
strip = false
incremental = false

