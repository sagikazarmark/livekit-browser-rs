[application]
name = "livekit-dioxus-prototype"
out_dir = "dist"

[web.app]
title = "LiveKit + Dioxus WASM prototype"

[web.watcher]
reload_html = true
watch_path = ["src", "assets"]

[web.resource]
style = ["/styles.css"]
script = ["/livekit-client.umd.min.js"]

# Required by dioxus-cli: `WebResourceConfig::dev` has no serde default.
[web.resource.dev]
script = []
