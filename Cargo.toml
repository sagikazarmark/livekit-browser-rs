[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/livekit-browser-rs"
homepage = "https://github.com/sagikazarmark/livekit-browser-rs"

[workspace.lints.rust]
missing_docs = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(docsrs)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.dependencies]
base64 = "0.23"
dioxus = "0.7"
futures-core = "0.3"
futures-executor = "0.3"
futures-util = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
