[graph]
all-features = true
# These crates are browser-only. Scoping to the shipped target keeps the policy over what is
# actually distributed, rather than over Dioxus's desktop and mobile branches.
targets = ["wasm32-unknown-unknown"]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",

  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
