[package]
name = "livekit-prototype-token-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
livekit-api = { version = "=0.5.6", default-features = false, features = ["access-token"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
