name: livekit-dioxus-prototype

services:
  livekit:
    image: livekit/livekit-server:v1.13.4
    profiles: ["local"]
    command: ["--dev", "--bind", "0.0.0.0", "--udp-port", "7882"]
    environment:
      NODE_IP: "${LAN_IP:-127.0.0.1}"
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"

  token-server:
    build:
      context: ./token-server
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-secret}"
      LIVEKIT_NON_PUBLISHER_IDENTITIES: publisher-permissions-denied
      LIVEKIT_NON_DATA_PUBLISHER_IDENTITIES: data-packets-denied,data-streams-denied
      LIVEKIT_NON_METADATA_UPDATER_IDENTITIES: participant-state-denied

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - token-server
    environment:
      LAN_HOST: "${LAN_HOST:-127.0.0.1.nip.io}"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:8080"
      - "8443:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  smoke:
    build:
      context: .
      dockerfile: Dockerfile.smoke
    profiles: ["test"]
    network_mode: host
    working_dir: /work
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-secret}"
      BASE_URL: "http://127.0.0.1:${HTTP_PORT:-8081}"
    volumes:
      - ./tests:/tests:ro
    command:
      [
        "sh",
        "-lc",
        "pulseaudio --start --exit-idle-time=-1 && cp -R /tests/. /work && npm ci --ignore-scripts --no-audit --no-fund && npx playwright test",
      ]

volumes:
  caddy_data:
  caddy_config:
