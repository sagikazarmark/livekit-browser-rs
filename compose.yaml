name: livekit-dioxus-prototype

services:
  livekit:
    image: livekit/livekit-server:v1.13.4
    profiles: ["local"]
    command: ["--dev", "--bind", "0.0.0.0", "--udp-port", "7882"]
    environment:
      NODE_IP: "${LAN_IP:-127.0.0.1}"
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-secret}"
      LIVEKIT_NON_PUBLISHER_IDENTITIES: publisher-permissions-denied
      LIVEKIT_NON_DATA_PUBLISHER_IDENTITIES: data-packets-denied,data-streams-denied
      LIVEKIT_NON_METADATA_UPDATER_IDENTITIES: participant-state-denied

  gateway:
    image: caddy:2.10.0-alpine
    depends_on:
      - app
    environment:
      LAN_HOST: "${LAN_HOST:-127.0.0.1.nip.io}"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:8080"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
