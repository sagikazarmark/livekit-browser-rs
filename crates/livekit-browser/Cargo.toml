[package]
name = "livekit-browser"
version = "0.1.0"
edition = "2021"
readme = "README.md"
publish = false

# These crates only function in a browser, so docs.rs documents the wasm32 build.
# `raw-js` and `tracing` items are labeled through `doc(cfg)`, which needs `--cfg docsrs`.
[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
raw-js = []
tracing = ["dep:tracing"]

[dependencies]
base64 = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
tracing = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "HtmlAudioElement", "HtmlMediaElement", "HtmlVideoElement", "MediaStream"] }

[dev-dependencies]
futures-executor = { workspace = true }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
