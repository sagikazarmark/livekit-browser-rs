[package]
name = "livekit-browser-recording"
version.workspace = true
description = "Browser local clip recording for livekit-browser Local Media Tracks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["livekit", "recording", "mediarecorder", "wasm", "webrtc"]
categories = ["wasm", "web-programming", "multimedia"]

[dependencies]
# Pinned exactly: this crate builds on the `local_clip_recording_support` integration seam, which is
# `#[doc(hidden)]` and carries no compatibility guarantee across `livekit-browser` releases.
livekit-browser = { version = "=0.1.0", path = "../livekit-browser" }
web-sys = { workspace = true, features = ["Blob"] }

# This crate only functions in a browser, so docs.rs documents the wasm32 build.
[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]
all-features = true


[lints]
workspace = true
